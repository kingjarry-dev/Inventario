name: Crear instalador de Windows

on:
  workflow_dispatch:      # botón manual en la pestaña Actions
  push:
    tags: ['v*']          # al subir una etiqueta como v1.1.0 → compila y publica el Release

permissions:
  contents: write         # necesario para crear el Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: inventario-windows
          path: |
            dist/*.exe
      - name: Publicar Release con los instaladores
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
